# main 브랜치에 push 하면 GitHub Pages 에 자동으로 배포합니다.
# 저장소 Settings > Pages > Build and deployment > Source 를 'GitHub Actions' 로 바꿔야 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # '마지막 수정' 날짜를 마지막 커밋에서 읽기 때문에 기록 전체를 가져옵니다.
          fetch-depth: 0
      - name: Install, build, and upload
        # npm run build 를 실행합니다. 예시 내용이 남아 있으면 여기서 멈춥니다.
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
